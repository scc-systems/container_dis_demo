services:
  wallsync:
    image: scc-registry.lancs.ac.uk/wallsync:1
    container_name: wallsync
    restart: unless-stopped
    env_file: /docker/env/wallsync.env
    tmpfs:
      - /tmp
    volumes:
      - /docker/vols/wallsync:/data/videos
    networks:
      - net0
    security_opt:
      - no-new-privileges:true
    read_only: true
    logging:
      driver: syslog
      options:
        tag: "docker.wallsync"