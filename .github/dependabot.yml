version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    groups:
      go-deps:
        patterns: ["*"]
        update-types: [minor, patch]
    assignees: [mavi0] # merged by hand, see dependabot-release.yml
    commit-message:
      prefix: build(deps)

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    assignees: [mavi0] # merged by hand, see dependabot-release.yml
    commit-message:
      prefix: build(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: build(deps)
