name: Dependabot release

# When a Dependabot update other than GitHub Actions is merged, tag the next
# patch release so a new image is built and Watchtower picks it up.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  tag:
    if: >-
      github.event.pull_request.merged &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'dependabot/github_actions/')
    runs-on: ubuntu-latest

    steps:
      # Tags pushed with GITHUB_TOKEN don't trigger workflows, so the build is
      # started on the tag explicitly.
      - name: Tag patch release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for attempt in 1 2 3; do
            latest=$(gh api "repos/$REPO/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/")' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
            IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
            next="v${major#v}.$minor.$((patch + 1))"
            # Fails if another merge created the same tag first; retry with the next number.
            if gh api "repos/$REPO/git/refs" -f ref="refs/tags/$next" -f sha="$SHA" >/dev/null; then
              echo "Tagged $SHA as $next"
              gh workflow run build.yml -R "$REPO" --ref "$next"
              exit 0
            fi
            sleep 5
          done
          exit 1
