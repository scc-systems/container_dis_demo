name: Build and Push

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  IMAGE_NAME: wallsync

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Run tests
      run: go test ./...

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.DOCKER_REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Semver tag policy:
    #   v1.2.3         -> :1.2.3 (immutable) + :1.2 + :1 (moving) + :latest
    #   v1.2.3-rc1     -> :1.2.3-rc1 only — pre-release tags do not move
    #                      :X, :X.Y, or :latest
    - name: Compute image tags
      id: tags
      shell: bash
      env:
        IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      run: |
        set -eu
        version="${{ github.ref_name }}"
        version="${version#v}"
        if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          {
            echo "list<<EOF"
            echo "${IMAGE}:${version}"
            echo "${IMAGE}:${major}.${minor}"
            echo "${IMAGE}:${major}"
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        else
          {
            echo "list<<EOF"
            echo "${IMAGE}:${version}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        fi

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.tags.outputs.list }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Summarise pushed tags
      run: |
        {
          echo "### Pushed image tags"
          echo ""
          echo '```'
          echo "${{ steps.tags.outputs.list }}"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
