name: Build & push

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Dependabot PRs without the Dependabot copy of the secrets still need a
  # valid image name to build, so fall back to the usual registry.
  REGISTRY: ${{ secrets.DOCKER_REGISTRY || 'scc-registry.lancs.ac.uk' }}
  IMAGE:    wallsync

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      # PR builds push a preview image when the registry credentials are
      # available. Dependabot PRs only see Dependabot secrets, so without them
      # they build without pushing instead of failing.
      PUSH: ${{ github.event_name != 'pull_request' || secrets.DOCKER_USERNAME != '' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the PR image version

      # PR images are tagged <current release>-pr<number>-<short hash>,
      # e.g. 0.0.4-pr23-abc1234.
      - name: Version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            current=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' 2>/dev/null || echo v0.0.0)
            echo "version=${current#v}-pr$PR-${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.event_name == 'pull_request' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: VERSION=${{ steps.version.outputs.version }}
          push: ${{ env.PUSH == 'true' }}
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # GitHub Actions updates only touch CI, so merge them once everything passes.
  # Other Dependabot updates are merged by hand (see dependabot-release.yml).
  dependabot-automerge:
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/github_actions/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --merge --delete-branch

  # Assign a human when a Dependabot Actions update can't be merged automatically.
  dependabot-assign:
    needs: [test, build, dependabot-automerge]
    if: >-
      failure() &&
      github.event_name == 'pull_request' &&
      github.actor == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/github_actions/')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Assign
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-assignee mavi0
